# ==================== DATABASE CONFIGURATION ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/menteleve_db
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA/HIBERNATE CONFIGURATION ====================
# Estratégia de atualização do banco (Cria as tabelas sozinho baseado no Java)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostrar no console as queries SQL que o Spring está fazendo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ==================== SERVER CONFIGURATION ====================
server.port=8080
server.servlet.context-path=/
spring.application.name=menteleve-api

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.menteleve.api=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
