# ==================== DATABASE CONFIGURATION ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/menteleve_db
spring.datasource.username=menteleve_user
spring.datasource.password=menteleve_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA/HIBERNATE CONFIGURATION ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ==================== SERVER CONFIGURATION ====================
server.port=8080
server.servlet.context-path=/
spring.application.name=menteleve-api

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.menteleve.api=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ==================== JWT CONFIGURATION ====================
jwt.secret=MenteLeve2026SuperSecretKeyForJWT512BitsAtLeastForHS512Algorithm!
jwt.expiration=86400000

